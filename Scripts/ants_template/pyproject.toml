[project]
name = "ants-template"
version = "0.1.0"
description = "Python equivalent of antsMultivariateTemplateConstruction using NiftyReg"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "niftyregw>=0.1.3",
    "typer>=0.24.1",
]

[project.scripts]
ants-template = "ants_template.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ants_template"]
